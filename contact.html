<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css" media="screen and (max-width: 600px)">
    <link rel="stylesheet" href="tablet.css" media="screen and (min-width: 601px) and (max-width: 900px)">
    <link rel="stylesheet" href="desktop.css" media="screen and (min-width: 901px)">
</head>



<body>
    <header class="header">
        <div class="wrap">
            <p class="name">Kieron's Portfolio</p>
            <nav aria-label="Main navigation">
                <ul class="nav">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Me</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <main class="wrap">

        <section class="content" aria-labelledby="contact-heading">
            <h1 id="contact-heading">Contact Me</h1>
            <p class="note">Write me a message here! (valid input needed)</p>

            <!-- all the checks here -->
            <form class="form" action="mailto:kieron.edwards@ontariotechu.net" method="post" enctype="text/plain" name="contact">
                <p>
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" required>
                </p>
                <p>
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required>
                </p>
                <p>
                    <label for="phone">Phone (optional)</label>
                    <input id="phone" name="phone" type="tel" pattern="[0-9+() .-]{7,20}" title="Use 7 to 20 digits , spaces, or phone punctuation">
                </p>
                <p>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </p>
                <p><button type="submit">Submit</button></p>
            </form>
        </section>

    </main>


    <footer class="footer">
        <p>Email: kieron.edwards@ontariotechu.net</p>
        <p>© 2026 Kieron Edwards</p>
    </footer>


</body>
</html>
